name: s3-archive image

on:
  push:
    branches: [ s3-archive ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: s3-archive-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Test
        run: ./gradlew :komga:check

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/komga
          tags: |
            type=raw,value=s3-archive
            type=sha,prefix=s3-archive-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/s3-archive.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
